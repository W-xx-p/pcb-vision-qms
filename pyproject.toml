[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-anomaly-quality-platform"
version = "0.1.0"
description = "Few-shot PCB anomaly detection and quality management platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pillow>=10.0,<13.0",
  "numpy>=1.26,<3.0",
  "redis>=5.2,<8.0",
  "minio>=7.2,<8.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "httpx>=0.27,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "pymodbus>=3.8,<4.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<10.0", "ruff>=0.8,<1.0"]
anomalib = [
  "anomalib==2.7.0",
  "openvino>=2025.0",
  "onnx>=1.17",
  "pandas>=2.2,<3",
]
edge = ["opencv-python-headless>=4.10,<5.0"]
load = ["locust>=2.32,<3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]  # FastAPI dependency declarations intentionally call Depends/File.

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]
